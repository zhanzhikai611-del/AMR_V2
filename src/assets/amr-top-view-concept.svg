<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 88" role="img" aria-labelledby="title desc">
  <title id="title">AMR 俯视图标</title>
  <desc id="desc">带左右驱动轮、载物平台、前保险杠和蓝色状态灯的自主移动机器人</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#183746" flood-opacity=".28"/>
    </filter>
    <filter id="lamp" x="-100%" y="-200%" width="300%" height="500%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
  </defs>

  <!-- Direction is up. The small chevron stays readable at map scale. -->
  <path d="M36 3 42 11H30Z" fill="#1677ff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <!-- Exposed wheels make the silhouette read as a mobile robot. -->
    <rect x="7" y="29" width="8" height="25" rx="3" fill="#102d45" stroke="#fff" stroke-width="2"/>
    <rect x="57" y="29" width="8" height="25" rx="3" fill="#102d45" stroke="#fff" stroke-width="2"/>

    <!-- Lower skirt provides the fake-2D chassis thickness. -->
    <path d="M17 18h38c5 0 8 4 8 9v35c0 7-5 12-12 12H21c-7 0-12-5-12-12V27c0-5 3-9 8-9Z"
      fill="#17466a" stroke="#fff" stroke-width="2.5"/>

    <!-- Light upper shell keeps the vehicle distinct from the grey point cloud. -->
    <path d="M19 13h34c5 0 9 4 9 9v34c0 7-5 12-12 12H22c-7 0-12-5-12-12V22c0-5 4-9 9-9Z"
      fill="#f4faff" stroke="#17466a" stroke-width="2"/>

    <!-- Front bumper and sensor corners define the nose. -->
    <path d="M20 13h32c4 0 7 2 9 6l-7 7H18l-7-7c2-4 5-6 9-6Z"
      fill="#fff" stroke="#4c7894" stroke-width="1.5"/>
    <circle cx="18" cy="20" r="2.4" fill="#0f3652" stroke="#7de3ff" stroke-width=".8"/>
    <circle cx="54" cy="20" r="2.4" fill="#0f3652" stroke="#7de3ff" stroke-width=".8"/>

    <!-- Cargo/deck plate is the most recognizable AMR surface. -->
    <rect x="20" y="30" width="32" height="28" rx="5" fill="#ccecff" stroke="#fff" stroke-width="2"/>
    <path d="M25 35h6M41 35h6M25 53h6M41 53h6" stroke="#5594b7" stroke-width="1.5" stroke-linecap="round"/>
    <text x="36" y="49" fill="#123b57" stroke="#fff" stroke-width="1" paint-order="stroke"
      font-family="Arial, sans-serif" font-size="15" font-weight="900" text-anchor="middle">03</text>

    <!-- Status is a lamp, never the whole vehicle body. -->
    <path d="M22 18h28" stroke="#1677ff" stroke-width="7" stroke-linecap="round" opacity=".25" filter="url(#lamp)"/>
    <path d="M22 18h28" stroke="#1677ff" stroke-width="3.5" stroke-linecap="round"/>

  </g>
</svg>
